[workspace]
members = ["citole-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
strip = true
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true
